name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per ref: a new push to a PR supersedes the previous run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0'
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore DesignerlessMigrations.slnx

      - name: Build
        run: dotnet build DesignerlessMigrations.slnx -c Release --no-restore

      # Unit tests plus end-to-end tests (real dotnet ef, dotnet publish, converter); Docker is preinstalled on the runner.
      - name: Test
        run: dotnet test --solution DesignerlessMigrations.slnx -c Release --no-build

      - name: Test samples against packed packages
        env:
          DESIGNERLESS_SAMPLE_VERSION: 10.0.0-ci.${{ github.run_number }}.${{ github.run_attempt }}
        run: bash eng/test-samples.sh
